[DEFAULT]
# 명령어 파일(cog)이 들어 있는 폴더
COG_DIR = app/cogs

[CLIENT]
# 디스코드 봇 토큰
TOKEN = 여기에_봇_토큰_입력
# 명령어 앞에 붙는 기호
PREFIX = ;
# 상태 메시지 종류: online, idle, dnd, invisible 중 하나
STATUS = dnd
# 봇 상태 아래 표시될 문구
ACTIVITY = 가상 자판기 운영 중
# 관리자 명령어를 쓸 수 있는 본인의 디스코드 사용자 ID
MANAGER_ID = 123456789012345678

[EMBED]
# 임베드 색상 (10진수). 예: 16777215 = 흰색
COLOR = 16777215

[DB]
# PostgreSQL 데이터베이스 이름
DB_NAME = vending
# 데이터베이스 사용자 이름
USER = postgres
